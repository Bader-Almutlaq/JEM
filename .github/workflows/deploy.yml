# Publishes the app to GitHub Pages: on a push to main, or started by hand (`make deploy`, the GitHub API or the Actions tab).
# Actions are pinned to their first Node 24 major (GitHub retired Node 20 for actions).
# Only the built app is published; there is no server and no data.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make verify
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Deep links (e.g. /JEM/settings) load the app on first visit.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
